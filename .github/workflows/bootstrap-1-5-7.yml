name: Bootstrap Pexpo 1.5.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message != 'chore: initialize Pexpo 1.5.7 beta baseline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta repository
        uses: actions/checkout@v4

      - name: Copy exact Pexpo 1.5.7 source snapshot
        run: |
          set -euo pipefail
          SOURCE_SHA=761c3f27265717260fa97ecab17a0d65092b42bd
          git clone --no-tags https://github.com/frRitamDas/bitmuse.git /tmp/pexpo-source
          cd /tmp/pexpo-source
          git fetch --no-tags origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          cd -
          rsync -a --delete --exclude='.git' /tmp/pexpo-source/ ./
          rm -f .git/refs/remotes/origin/HEAD 2>/dev/null || true

      - name: Commit exact 1.5.7 baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Pexpo 1.5.7 beta baseline"
          git push origin HEAD:main
