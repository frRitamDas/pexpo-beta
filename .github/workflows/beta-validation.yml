name: Pexpo 1.6 Beta Validation

on:
  push:
    branches: [1.6-beta]
  pull_request:
    branches: [1.6-beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pexpo-1-6-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Verify beta identity and version
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.music.pexpo.beta"' app/build.gradle.kts
          grep -F 'versionCode = 24' app/build.gradle.kts
          grep -F 'versionName = "1.6.1-beta.1"' app/build.gradle.kts
      - name: Verify no unsafe stream API calls
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=.git --exclude-dir=build --include='*.kt' --include='*.java' 'streamAsJsonObjects' .; then
            echo 'Unsafe streamAsJsonObjects usage remains in project source.' >&2
            exit 1
          fi
      - name: Build Dev Debug APK
        run: ./gradlew clean assembleDevDebug --stacktrace
      - name: Run JVM tests
        run: ./gradlew test --stacktrace
      - name: Upload Dev Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.6.1-beta.1-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

  beta-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Create temporary beta signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore beta-temp.jks \
            -storetype JKS \
            -alias pexpo-beta-temp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -storepass beta-temp-store \
            -keypass beta-temp-key \
            -dname "CN=Pexpo Beta Temporary, OU=Beta, O=Pexpo, L=Kolkata, ST=West Bengal, C=IN"
          cat > keystore.properties <<'EOF'
storeFile=beta-temp.jks
storePassword=beta-temp-store
keyAlias=pexpo-beta-temp
keyPassword=beta-temp-key
EOF
      - name: Build isolated signed beta APKs
        run: ./gradlew clean assembleProdRelease --stacktrace
      - name: Verify APK package, version and signature identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/prod/release/app-prod-universal-release.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.music.pexpo.beta' versionCode='24' versionName='1.6.1-beta.1'" >/dev/null
          keytool -printcert -jarfile "$APK" | grep -F 'Owner: CN=Pexpo Beta Temporary' >/dev/null
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.6.1-beta.1-universal.apk
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.6.1-beta.1-arm64-v8a.apk
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.6.1-beta.1-armeabi-v7a.apk
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.6.1-beta.1-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.6.1-beta.1-release
          path: release-assets/*
      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.6.1-beta.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.1-beta.1 \
            release-assets/pexpo-1.6.1-beta.1-universal.apk \
            release-assets/pexpo-1.6.1-beta.1-arm64-v8a.apk \
            release-assets/pexpo-1.6.1-beta.1-armeabi-v7a.apk \
            release-assets/pexpo-1.6.1-beta.1-x86_64.apk \
            release-assets/SHA256SUMS.txt \
            --title "Pexpo 1.6.1 Beta 1" \
            --notes "Pexpo 1.6.1 Beta 1.\n\nThis is an in-place beta update over the same isolated package ID com.music.pexpo.beta. Install it over an existing Pexpo beta without uninstalling the beta first. Production Pexpo remains com.music.pexpo and is untouched.\n\nValidation: DevDebug build, JVM tests, beta package/version identity and release APK signing identity.\n\nUniversal, arm64-v8a, armeabi-v7a and x86_64 APKs plus SHA-256 checksums are attached." \
            --prerelease
