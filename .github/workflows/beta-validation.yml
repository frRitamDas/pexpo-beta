name: Pexpo 1.6 Beta Validation

on:
  pull_request:
    branches: [1.6-beta]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: pexpo-1-6-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Verify beta identity and version
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.music.pexpo.beta"' app/build.gradle.kts
          grep -F 'versionCode = 25' app/build.gradle.kts
          grep -F 'versionName = "1.6.1-beta.1"' app/build.gradle.kts
      - name: Verify no unsafe stream API calls
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --exclude-dir=.git --exclude-dir=build --include='*.kt' --include='*.java' 'streamAsJsonObjects' .; then
            echo 'Unsafe streamAsJsonObjects usage remains in project source.' >&2
            exit 1
          fi
      - name: Build Dev Debug APK
        run: ./gradlew clean assembleDevDebug --stacktrace
      - name: Run JVM tests
        run: ./gradlew test --stacktrace
      - name: Upload Dev Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.6.1-beta.1-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

  beta-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout merged beta
        uses: actions/checkout@v4
        with:
          ref: 1.6-beta
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant Gradle execute permission
        run: chmod +x gradlew
      - name: Require persistent beta signing secrets
        shell: bash
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BETA_KEYSTORE_BASE64" || { echo 'Missing BETA_KEYSTORE_BASE64 repository secret.' >&2; exit 1; }
          test -n "$BETA_STORE_PASSWORD" || { echo 'Missing BETA_STORE_PASSWORD repository secret.' >&2; exit 1; }
          test -n "$BETA_KEY_ALIAS" || { echo 'Missing BETA_KEY_ALIAS repository secret.' >&2; exit 1; }
          test -n "$BETA_KEY_PASSWORD" || { echo 'Missing BETA_KEY_PASSWORD repository secret.' >&2; exit 1; }
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > beta-signing.jks
          test -s beta-signing.jks
          cat > keystore.properties <<EOF
storeFile=beta-signing.jks
storePassword=$BETA_STORE_PASSWORD
keyAlias=$BETA_KEY_ALIAS
keyPassword=$BETA_KEY_PASSWORD
EOF
      - name: Build isolated signed beta APKs
        run: ./gradlew clean assembleProdRelease --stacktrace
      - name: Verify APK package, version and signing certificate
        shell: bash
        env:
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/prod/release/app-prod-universal-release.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.music.pexpo.beta' versionCode='25' versionName='1.6.1-beta.1'" >/dev/null
          APK_CERT=$(keytool -printcert -jarfile "$APK" | sed -n 's/^Owner: //p')
          KEY_CERT=$(keytool -list -v -keystore beta-signing.jks -storepass "$BETA_STORE_PASSWORD" -alias "$BETA_KEY_ALIAS" | sed -n 's/^Owner: //p' | head -1)
          test -n "$APK_CERT"
          test -n "$KEY_CERT"
          test "$APK_CERT" = "$KEY_CERT"
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.6.1-beta.1-universal.apk
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.6.1-beta.1-arm64-v8a.apk
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.6.1-beta.1-armeabi-v7a.apk
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.6.1-beta.1-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.6.1-beta.1-release
          path: release-assets/*
      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.6.1-beta.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.1-beta.1 \
            release-assets/pexpo-1.6.1-beta.1-universal.apk \
            release-assets/pexpo-1.6.1-beta.1-arm64-v8a.apk \
            release-assets/pexpo-1.6.1-beta.1-armeabi-v7a.apk \
            release-assets/pexpo-1.6.1-beta.1-x86_64.apk \
            release-assets/SHA256SUMS.txt \
            --title "Pexpo 1.6.1 Beta 1" \
            --notes "Pexpo 1.6.1 Beta 1.\n\nThis beta uses the fixed package ID com.music.pexpo.beta and the persistent beta signing identity. Future 1.6.x beta APKs can update this installation in place without uninstalling. Production Pexpo remains com.music.pexpo and is untouched.\n\nUniversal, arm64-v8a, armeabi-v7a and x86_64 APKs plus SHA-256 checksums are attached." \
            --prerelease
