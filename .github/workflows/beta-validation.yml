name: Pexpo 1.6 Beta Validation

on:
  push:
    branches: [1.6-beta]
  pull_request:
    branches: [1.6-beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pexpo-1-6-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Dev Debug APK
        run: ./gradlew clean assembleDevDebug --stacktrace

      - name: Run JVM tests
        run: ./gradlew test --stacktrace

  beta-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Create temporary beta signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore beta-temp.jks \
            -storetype JKS \
            -alias pexpo-beta-temp \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -storepass beta-temp-store \
            -keypass beta-temp-key \
            -dname "CN=Pexpo Beta Temporary, OU=Beta, O=Pexpo, L=Kolkata, ST=West Bengal, C=IN"
          cat > keystore.properties <<'EOF'
storeFile=beta-temp.jks
storePassword=beta-temp-store
keyAlias=pexpo-beta-temp
keyPassword=beta-temp-key
EOF

      - name: Build isolated signed beta APK
        run: ./gradlew clean assembleProdRelease --stacktrace

      - name: Locate and checksum universal APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*universal*.apk' | sort | head -n 1)"
          if [[ -z "$apk" ]]; then
            apk="$(find app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          fi
          test -n "$apk"
          cp "$apk" "pexpo-1.6.0-beta.1.apk"
          sha256sum "pexpo-1.6.0-beta.1.apk" > "pexpo-1.6.0-beta.1.apk.sha256"

      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.6.0-beta.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.6.0-beta.1 \
            "pexpo-1.6.0-beta.1.apk" \
            "pexpo-1.6.0-beta.1.apk.sha256" \
            --title "Pexpo 1.6.0 Beta 1" \
            --notes "Pexpo 1.6 Beta 1.\n\nThis is an isolated beta build from the 1.6-beta branch. The production repository is not modified by this release.\n\nValidation gates: DevDebug build and JVM test suite.\nThe beta package ID is com.music.pexpo.beta, so it installs beside the production Pexpo app. The release APK is signed with a temporary CI-generated beta key and is not intended as a long-term signing identity." \
            --prerelease
